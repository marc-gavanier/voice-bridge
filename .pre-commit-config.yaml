default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, pre-push]
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: check-merge-conflict
        name: no merge conflict markers
        entry: uv run --frozen check-merge-conflict --assume-in-merge
        language: system
        types: [text]
      - id: check-added-large-files
        name: no large files
        entry: uv run --frozen check-added-large-files --enforce-all
        language: system
      - id: end-of-file-fixer
        name: files end with one newline
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: no trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
      - id: check-toml
        name: toml syntax
        entry: uv run --frozen check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: yaml syntax
        entry: uv run --frozen check-yaml
        language: system
        types: [yaml]
      - id: validate-pyproject
        name: validate pyproject.toml
        entry: uv run --frozen validate-pyproject
        language: system
        files: ^pyproject\.toml$
      - id: zizmor
        name: zizmor
        entry: uv run --frozen zizmor --offline .
        language: system
        files: ^\.github/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: import-linter
        name: architecture contracts
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: alint
        name: allowed folders
        entry: uv run --frozen alint check
        language: system
        pass_filenames: false
        always_run: true
      - id: deptry
        name: deptry
        entry: uv run --frozen deptry src
        language: system
        files: ^(src/|pyproject\.toml$)
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest --quiet
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
      - id: uv-lock
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: typos
        name: spelling
        entry: uv run --frozen typos
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: shellcheck
        entry: uv run --frozen shellcheck
        language: system
        types: [shell]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: commitizen
        name: conventional commit message
        entry: uv run --frozen cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: uv-audit
        name: uv audit
        entry: uv audit --frozen --preview-features audit-command
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
