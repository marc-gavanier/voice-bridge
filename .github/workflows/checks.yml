name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get install --yes --no-install-recommends libopus0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen prek run --all-files --show-diff-on-failure check-merge-conflict check-added-large-files end-of-file-fixer trailing-whitespace check-toml check-yaml
      - run: uv run --frozen validate-pyproject pyproject.toml
      - run: uv run --frozen prek run --all-files actionlint
      - run: uv run --frozen zizmor .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ruff check
      - run: uv run --frozen basedpyright
      - run: uv run --frozen lint-imports
      - run: uv run --frozen alint check
      - run: uv run --frozen deptry src
      - run: uv run --frozen pytest
      - run: uv run --frozen shellcheck scripts/*.sh
      - run: uv audit --frozen --preview-features audit-command
      - if: github.event_name == 'pull_request'
        run: uv run --frozen cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
