[project]
name = "voice-bridge"
version = "0.1.0"
description = "Talk to a Claude Code session by voice over Mumble"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4.15.1",
    "faster-whisper",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "platformdirs>=4.14.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymumble-rev==0.1.0",
    "soxr>=1.1.0",
    "stamina>=26.1.0",
]

[project.scripts]
voice-bridge-channel = "voice_bridge.entrypoints.channel:main"
voice-bridge-rehearsal = "voice_bridge.entrypoints.rehearsal:main"
voice-bridge-recorder = "voice_bridge.entrypoints.recorder:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "commitizen>=4.19.3",
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "prek>=0.5.9",
    "pydeps>=3.0.9",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "shellcheck-py>=0.11.0.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.7"
exclude-newer = "10 days"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "CPY", "COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.basedpyright]
typeCheckingMode = "all"
include = ["src", "tests"]
stubPath = "typings"

[tool.pytest]
minversion = "9.2"
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib", "--cov", "--cov-branch", "--cov-report=term-missing:skip-covered"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["voice_bridge"]
omit = [
    "*/voice_bridge/entrypoints/channel.py",
    "*/voice_bridge/entrypoints/logs.py",
    "*/voice_bridge/entrypoints/recorder.py",
    "*/voice_bridge/entrypoints/rehearsal.py",
    "*/voice_bridge/entrypoints/voice.py",
    "*/voice_bridge/libraries/mumble/connection.py",
]

[tool.coverage.report]
fail_under = 100
exclude_also = ["assert_never\\("]

[tool.importlinter]
root_package = "voice_bridge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Entry points wire configuration and features, which rest on libraries"
type = "layers"
layers = [
    "voice_bridge.entrypoints",
    "voice_bridge.configuration | voice_bridge.features",
    "voice_bridge.libraries",
]

[[tool.importlinter.contracts]]
name = "Features do not know each other"
type = "independence"
modules = [
    "voice_bridge.features.conversation",
    "voice_bridge.features.hearing",
    "voice_bridge.features.recording",
    "voice_bridge.features.speaking",
]

[[tool.importlinter.contracts]]
name = "Inside a feature, abilities use implementations, which use the domain"
type = "layers"
containers = [
    "voice_bridge.features.conversation",
    "voice_bridge.features.hearing",
    "voice_bridge.features.recording",
    "voice_bridge.features.speaking",
]
layers = ["abilities", "(implementations)", "domain"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domains are pure Python"
type = "forbidden"
source_modules = ["voice_bridge.features.*.domain"]
forbidden_modules = [
    "voice_bridge.libraries",
    "anyio",
    "faster_whisper",
    "httpx",
    "mcp",
    "numpy",
    "platformdirs",
    "pydantic",
    "pydantic_settings",
    "pymumble_rev",
    "soxr",
    "stamina",
]

[tool.deptry]
known_first_party = ["voice_bridge"]

[tool.deptry.per_rule_ignores]
DEP002 = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.pydeps]
only = ["voice_bridge"]
max_module_depth = 3
rmprefix = ["voice_bridge."]
exclude_exact = ["voice_bridge.configuration", "voice_bridge.features", "voice_bridge.libraries"]
rankdir = "BT"
no_show = true
format = "svg"
output = "docs/architecture.svg"
