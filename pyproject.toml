[project]
name = "voice-bridge"
version = "0.1.0"
description = "Talk to a Claude Code session by voice over Mumble"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymumble",
    "setuptools<81",
    "faster-whisper",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
